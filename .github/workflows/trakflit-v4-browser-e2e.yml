name: TRAKFLIT V4 browser E2E

on:
  push:
    branches:
      - test/trakflit-v4-browser-e2e
    paths:
      - '.github/workflows/trakflit-v4-browser-e2e.yml'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/database/**'
      - 'supabase/tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trakflit-v4-browser-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    if: github.ref == 'refs/heads/test/trakflit-v4-browser-e2e'
    name: Isolated V4 Supabase + Chromium E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out isolated testing branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.120.0"
          docker info --format '{{.ServerVersion}}' >/dev/null
          node --version
          npx playwright --version

      - name: TypeScript validation
        run: npm run typecheck

      - name: Loading and authentication regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-loading-driver-workflow.mjs
          node scripts/test-loading-trip-opening.mjs
          node scripts/test-loading-portal.mjs
          node scripts/test-field-session-workflow.mjs
          node scripts/test-login-password-visibility.mjs

      - name: Run isolated SQL suites and V4 browser E2E
        shell: bash
        run: bash scripts/ci/run-trakflit-sql-integration.sh

      - name: Stop only this run's temporary Supabase project
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -u
          project_id="trklci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test_root="${RUNNER_TEMP}/${project_id}"
          diagnostic_root="${RUNNER_TEMP}/trklci-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "${test_root}/supabase" ]]; then
            supabase stop --yes --project-id "${project_id}" --no-backup --workdir "${test_root}" >/dev/null 2>&1 || true
          fi
          if [[ "${test_root}" == "${RUNNER_TEMP}/trklci-"* && -d "${test_root}" ]]; then rm -rf -- "${test_root}"; fi
          if [[ "${diagnostic_root}" == "${RUNNER_TEMP}/trklci-diagnostics-"* && -d "${diagnostic_root}" ]]; then rm -rf -- "${diagnostic_root}"; fi
